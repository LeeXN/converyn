[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
default-members = ["crates/cli", "crates/runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"
repository = "https://github.com/LeeXN/converyn"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
aho-corasick = "1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
subtle = "2"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
time = "0.3"
x509-parser = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = "0.5"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[profile.release]
strip = true
lto = "thin"
