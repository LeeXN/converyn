# Ordered child stages consumed by render.py and compiled into one native PlanInput.
files:
- target: /etc/modules-load.d/converyn-community.conf
  source: configs/host/modules-load.d/converyn-community.conf
  format: text
- target: /etc/sysctl.d/99-converyn-community.conf
  source: configs/host/sysctl.d/99-converyn-community.conf
  format: text
- target: /etc/containerd/config.toml
  source: configs/host/containerd/config.toml
  format: text
- target: /etc/systemd/system/containerd.service
  source: configs/host/systemd/system/containerd.service
  format: text
- target: /etc/systemd/system/kubelet.service
  source: configs/host/systemd/system/kubelet.service
  format: text
- target: /opt/converyn-example/values/calico.json
  source: configs/helm/calico.yaml
  format: yaml
- target: /opt/converyn-example/values/csi-nfs.json
  source: configs/helm/csi-nfs.yaml
  format: yaml
- target: /opt/converyn-example/manifests/storage-class.json
  source: configs/manifests/storage-class.yaml
  format: yaml
- target: /opt/converyn-example/values/traefik.json
  source: configs/helm/traefik.yaml
  format: yaml
- target: /opt/converyn-example/values/harbor.json
  source: configs/helm/harbor.yaml
  format: yaml
- target: /opt/converyn-example/values/monitoring.json
  source: configs/helm/monitoring.yaml
  format: yaml
- target: /opt/converyn-example/manifests/issuers.json
  source: configs/manifests/issuers.yaml
  format: yaml
- target: /opt/converyn-example/manifests/harbor-certificate.json
  source: configs/manifests/harbor-certificate.yaml
  format: yaml
stages:
- id: 00-preflight
  kind: preflight
  script: preflight
  targets: all
- id: 01-runtime
  kind: runtime
  script: runtime
  targets: all
- id: 02-control-plane
  kind: kubeadm
  action: init
  targets: first-control
  config: init.yaml
- id: 02b-secondary-control-planes
  kind: kubeadm
  action: join
  targets: secondary-controls
  config: join-control-plane.yaml
  batch_size: 1
- id: 03-workers
  kind: kubeadm
  action: join
  targets: workers
  config: join-worker.yaml
- id: 04-calico
  kind: addon
  script: calico
  targets: first-control
  inputs:
  - charts/calico.tgz
  - charts/calico-crds.tgz
  - values/calico.json
  environment: {}
  timeout_seconds: 3600
- id: 05-storage
  kind: addon
  script: storage
  targets: first-control
  inputs:
  - charts/csi-nfs.tgz
  - values/csi-nfs.json
  - manifests/storage-class.json
  environment: {}
  timeout_seconds: 3600
- id: 06-cert-manager
  kind: addon
  script: cert-manager
  targets: first-control
  inputs:
  - manifests/cert-manager.yaml
  - manifests/issuers.json
  environment: {}
  timeout_seconds: 3600
- id: 07-ingress
  kind: addon
  script: ingress
  targets: first-control
  inputs:
  - charts/traefik.tgz
  - values/traefik.json
  environment: {}
  timeout_seconds: 3600
- id: 08-harbor
  kind: addon
  script: harbor
  targets: first-control
  inputs:
  - charts/harbor.tgz
  - values/harbor.json
  - manifests/harbor-certificate.json
  environment:
    HARBOR_PASSWORD_FILE: harbor_admin_password_file
  timeout_seconds: 3600
- id: 09-monitoring
  kind: addon
  script: monitoring
  targets: first-control
  inputs:
  - charts/monitoring.tgz
  - values/monitoring.json
  environment:
    GRAFANA_PASSWORD_FILE: grafana_admin_password_file
  timeout_seconds: 3600
- id: 10-verify
  kind: addon
  script: verify
  targets: first-control
  inputs: []
  environment:
    EXPECTED_NODES: node_count
    EXPECTED_CONTROL_PLANES: control_count
    HARBOR_HOST: harbor_host
    HTTPS_NODEPORT: harbor_https_nodeport
    CONTROL_ADDRESS: control_address
    STORAGE_CLASS: storage_class
    VERIFY_IMAGE: verification_image
    HARBOR_PASSWORD_FILE: harbor_admin_password_file
  timeout_seconds: 3600
