# Same digest-pinned BusyBox image used by the Kubernetes verification example.
name: demo-web
image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
platform: linux/amd64
command: [/bin/sh, -c, 'mkdir -p /tmp/www && printf "ok\n" > /tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www']
ports:
  - address: 127.0.0.1
    host: 8080
    container: 8080
healthcheck: wget -q -O /dev/null http://127.0.0.1:8080/
readiness_timeout_seconds: 60
user_id: 65534
